name: Update LMS Engagement Dashboard

on:
  push:
    paths:
      - 'lms-engagement-data/*.json'
      - 'lms-engagement-data/*.xlsx'
      - 'lms-engagement-data/*.xls'
      - 'lms-engagement-data/*.csv'
      - 'update_lms_engagement_dashboard.py'
      - 'lms_engagement_build.js'
      - 'lms_engagement_stats.js'
      - 'js/lms-engagement-core.js'
      - 'js/lms-engagement-app.js'
      - 'templates/lms-engagement-shell.html'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate LMS Engagement dashboard
        run: python update_lms_engagement_dashboard.py

      - name: Generate homepage
        run: python generate_homepage.py

      - name: Commit updated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lms-engagement.html index.html
          git diff --staged --quiet || git commit -m "Auto-update lms-engagement.html and index.html [skip ci]"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
