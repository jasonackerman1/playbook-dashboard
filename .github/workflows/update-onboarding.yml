name: Update Onboarding Dashboard

on:
  push:
    paths:
      - 'onboarding-data/*.xlsx'
      - 'data/playbook-monthly-*.xlsx'
      - 'data/playbook-weekly-*.xlsx'
      - 'update_onboarding_dashboard.py'
      - 'generate_homepage.py'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies
        run: npm ci

      - name: Generate onboarding.html
        run: python update_onboarding_dashboard.py

      - name: Regenerate homepage
        run: python generate_homepage.py

      - name: Commit and push generated HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add onboarding.html index.html
          git diff --cached --quiet || git commit -m "Auto-update onboarding.html [skip ci]"
          # Several workflows can fire from one push and all commit to main.
          # If another one pushed first, pull its commit and try again.
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            echo "Push rejected (another workflow pushed first) - retrying in $((i*5))s"
            sleep $((i*5))
          done
          exit 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
